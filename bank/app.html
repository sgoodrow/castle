<meta charset="utf-8">
<title>Castle Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Silkscreen&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: the classic EQ inventory window on the left (paper doll + gear totals), the bank browser on the right; item windows pop over both. One committed dark look, like the game client. */
:root {
  --bg: #140f19;
  --bg-veil: #1d1524;
  --window: #0c0a0f;
  --slot: #050406;
  --line: #3b3443;
  --line-hi: #6c6178;
  --fg: #ece7f1;
  --muted: #9c93a6;
  --gold: #dcb862;
  --magic: #a9c1ff;
  --good: #82d38a;
  --bad: #ec7a62;
  --warn: #e5c15a;
  --stone-hi: #b9b2a8;
  --stone-lo: #6e675f;
  --stone-ink: #1b1714;
  --sel: #e2c46d;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-pixel: "Silkscreen", "Courier New", monospace;
  --font-body: "Alegreya Sans", "Gill Sans", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(1200px 600px at 20% -10%, var(--bg-veil), transparent 60%), var(--bg);
  color: var(--fg);
  font: 15px/1.4 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin: 0 auto 14px; max-width: 1360px; }
.top h1 { font: 700 26px/1 var(--font-display); letter-spacing: .04em; margin: 0; color: var(--gold); }
.top .meta { color: var(--muted); font-size: 13px; }
.top .meta b { color: var(--fg); font-weight: 500; }

.layout { display: grid; grid-template-columns: minmax(0, 470px) minmax(0, 1fr); gap: 18px; max-width: 1360px; margin: 0 auto; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* ---------- EQ window chrome ---------- */
.win { background: var(--window); border: 1px solid var(--line); box-shadow: inset 0 0 0 1px #000, 0 10px 30px rgba(0,0,0,.45); }
.stone {
  font: 700 13px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase;
  color: var(--stone-ink); background: linear-gradient(var(--stone-hi), var(--stone-lo));
  border: 1px solid #000; box-shadow: inset 1px 1px 0 rgba(255,255,255,.45), inset -1px -1px 0 rgba(0,0,0,.4);
  padding: 7px 12px; cursor: pointer;
}
.stone:hover { filter: brightness(1.1); }
.stone:active { box-shadow: inset -1px -1px 0 rgba(255,255,255,.35), inset 1px 1px 0 rgba(0,0,0,.5); }
.stone[disabled] { filter: grayscale(1) brightness(.6); cursor: not-allowed; }

/* ---------- inventory window ---------- */
.inv { padding: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 900px) { .inv { position: static; } }
.inv-body { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 10px; }
@media (max-width: 440px) { .inv-body { grid-template-columns: minmax(0, 1fr); } }
.doll { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.slot {
  position: relative; aspect-ratio: 1; max-width: 100%; background: var(--slot);
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 0; cursor: pointer; display: grid; place-items: center; overflow: hidden;
}
.slot.empty-cell { cursor: default; }
.slot .lbl { position: absolute; top: 3px; left: 0; right: 0; text-align: center; font: 9px/1 var(--font-pixel); color: #d9d3df; letter-spacing: .02em; pointer-events: none; }
.slot img { width: 72%; height: 72%; image-rendering: auto; object-fit: contain; }
.slot.filled .lbl { opacity: .55; }
.slot:hover:not(.empty-cell) { background: #120f15; }
.slot.selected { box-shadow: inset 0 0 0 2px var(--sel); }
.slot.warn::after { content: "!"; position: absolute; right: 3px; bottom: 2px; font: 700 11px/1 var(--font-body); color: var(--bad); }

.whoami { display: grid; gap: 6px; padding: 10px 0 0; }
.whoami .row { display: flex; gap: 6px; flex-wrap: wrap; }
.whoami label { font: 9px/1 var(--font-pixel); color: var(--muted); display: grid; gap: 4px; flex: 1 1 110px; min-width: 0; }
.whoami input, .whoami select, .browser input, .browser select {
  background: var(--slot); border: 1px solid var(--line); padding: 6px 8px; font: 15px var(--font-body); letter-spacing: 0; min-width: 0; width: 100%;
}
.whoami .actions { display: flex; gap: 8px; justify-content: space-between; margin-top: 4px; }

.stats { font-size: 15px; display: grid; gap: 10px; align-content: start; }
.stats .name { font-size: 17px; line-height: 1.2; }
.stats .name small { display: block; color: var(--muted); font-size: 13px; }
.stats dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; margin: 0; font-variant-numeric: tabular-nums; }
.stats dt { text-align: right; letter-spacing: .04em; }
.stats dd { margin: 0; white-space: nowrap; }
.delta { font-size: 12px; margin-left: 4px; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.stats .caption { font-size: 12px; color: var(--muted); }

/* ---------- browser ---------- */
.browser { padding: 12px; display: grid; gap: 10px; min-width: 0; }
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .filters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .filters .search { grid-column: 1 / -1; } }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  font: 10px/1 var(--font-pixel); letter-spacing: .02em; background: var(--slot); border: 1px solid var(--line);
  padding: 6px 8px; cursor: pointer; color: #d9d3df;
}
.chip:hover { border-color: var(--line-hi); }
.chip[aria-pressed="true"] { border-color: var(--sel); color: var(--sel); background: #1a1508; }
.chip.mine { font-family: var(--font-body); font-size: 13px; padding: 5px 10px; }
.status { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: space-between; }

.list { display: grid; border-top: 1px solid var(--line); }
.item {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 8px 4px; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left;
  background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%;
}
.item:hover { background: #110e14; }
.item.unusable { opacity: .55; }
.ico { width: 40px; height: 40px; background: var(--slot); border: 1px solid var(--line); display: grid; place-items: center; }
.ico img { width: 36px; height: 36px; }
.item .nm { font-weight: 500; font-size: 15px; }
.item .nm .tag { font: 9px/1 var(--font-pixel); color: var(--muted); margin-left: 6px; vertical-align: 2px; }
.item .line { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.item .line b { color: var(--fg); font-weight: 500; }
.item .where { font-size: 12px; color: var(--muted); }
.item .right { display: grid; justify-items: end; gap: 4px; text-align: right; }
.price { font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
.price b { color: var(--gold); font-weight: 700; }
.price.thin b { color: var(--muted); }
.pill { font: 9px/1 var(--font-pixel); padding: 3px 5px; border: 1px solid currentColor; white-space: nowrap; }
.pill.solid { color: var(--good); }
.pill.thin { color: var(--warn); }
.pill.none { color: var(--muted); }
.cmp { font-size: 12px; font-variant-numeric: tabular-nums; }
.empty { padding: 30px 8px; color: var(--muted); text-align: center; }

/* ---------- item window ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.iw { width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 14px 16px 16px; display: grid; gap: 12px; }
.iw-head { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; }
.iw-head .ico { width: 48px; height: 48px; }
.iw-head .ico img { width: 44px; height: 44px; }
.iw h2 { margin: 0; font: 700 19px/1.2 var(--font-display); color: var(--fg); text-wrap: balance; }
.iw .flags { font: 10px/1.4 var(--font-pixel); color: var(--magic); letter-spacing: .03em; }
.iw .block { font-size: 15px; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.iw .block .k { color: var(--muted); }
.iw .grid2 { display: flex; flex-wrap: wrap; gap: 0 16px; }
.iw h3 { margin: 0 0 6px; font: 10px/1 var(--font-pixel); color: var(--muted); letter-spacing: .05em; }
.iw .sec { border-top: 1px solid var(--line); padding-top: 10px; }
.iw .holders { display: grid; gap: 3px; font-size: 14px; }
.iw .holders span { color: var(--muted); }
.iw .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.iw a { color: var(--magic); }
.iw .note { font-size: 13px; color: var(--muted); }

/* request */
.req { display: grid; gap: 8px; }
.req-line { display: flex; gap: 8px; align-items: stretch; }
.req-line code { flex: 1; min-width: 0; background: var(--slot); border: 1px solid var(--line); padding: 7px 9px; font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; user-select: all; }
.req .cost { font-size: 14px; }
.req .cost b { color: var(--gold); }

/* auction chart */
.auc-sum { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 14px; margin-bottom: 6px; }
.auc-sum b { color: var(--gold); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 10px var(--font-body); }
.chart .axis { stroke: var(--line); }
.chart .grid { stroke: #1f1a24; }
.sellers { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; margin-top: 6px; }
.sellers i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

@media (prefers-reduced-motion: no-preference) { .item, .slot, .chip { transition: background-color .12s, border-color .12s; } }
</style>

<header class="top">
  <h1>Castle Bank</h1>
  <div class="meta" id="meta"></div>
</header>

<div class="layout">
  <section class="win inv" aria-label="Inventory">
    <div class="inv-body">
      <div>
        <div class="doll" id="doll"></div>
        <div class="whoami">
          <div class="row">
            <label for="f-name">NAME<input id="f-name" maxlength="20" placeholder="Your character"></label>
            <label for="f-class">CLASS<select id="f-class"></select></label>
            <label for="f-race">RACE<select id="f-race"></select></label>
          </div>
          <div class="actions">
            <button class="stone" id="b-done" type="button">Done</button>
            <button class="stone" id="b-clear" type="button">Unequip all</button>
          </div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <section class="win browser" aria-label="Bank">
    <div class="filters">
      <label class="search"><span hidden>Search</span><input id="q" type="search" placeholder="Search items, e.g. ring, staff, haste" autocomplete="off"></label>
      <label><span hidden>Kind</span><select id="kind">
        <option value="all">All kinds</option>
        <option value="gear">Wearable gear</option>
        <option value="spell">Spells</option>
        <option value="bag">Containers</option>
        <option value="other">Everything else</option>
      </select></label>
      <label><span hidden>Banker</span><select id="banker"></select></label>
      <label><span hidden>Sort</span><select id="sort">
        <option value="name">Sort: name</option>
        <option value="ac">Sort: AC</option>
        <option value="hp">Sort: HP</option>
        <option value="mana">Sort: mana</option>
        <option value="stats">Sort: stat total</option>
        <option value="resists">Sort: resist total</option>
        <option value="price">Sort: Green price</option>
        <option value="sellers">Sort: auction activity</option>
        <option value="count">Sort: quantity</option>
      </select></label>
    </div>
    <div class="chips" id="mine"></div>
    <div class="chips" id="slots"></div>
    <div class="status" id="status"></div>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden></div>

<script id="bank-data" type="application/json">__BANK_DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("bank-data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- EQ constants ----------
const CLASSES = [["WAR","Warrior"],["CLR","Cleric"],["PAL","Paladin"],["RNG","Ranger"],["SHD","Shadow Knight"],["DRU","Druid"],["MNK","Monk"],["BRD","Bard"],["ROG","Rogue"],["SHM","Shaman"],["NEC","Necromancer"],["WIZ","Wizard"],["MAG","Magician"],["ENC","Enchanter"]];
const RACES = [["HUM","Human"],["BAR","Barbarian"],["ERU","Erudite"],["ELF","Wood Elf"],["HIE","High Elf"],["DEF","Dark Elf"],["HEF","Half Elf"],["DWF","Dwarf"],["TRL","Troll"],["OGR","Ogre"],["HFL","Halfling"],["GNM","Gnome"],["IKS","Iksar"]];
const ALL_CLASSES = (1 << CLASSES.length) - 1, ALL_RACES = (1 << RACES.length) - 1;
// Slot bits as stored in the item database.
const SLOT_NAMES = ["CHARM","EAR","HEAD","FACE","EAR","NECK","SHOULDERS","ARMS","BACK","WRIST","WRIST","RANGE","HANDS","PRIMARY","SECONDARY","FINGERS","FINGERS","CHEST","LEGS","FEET","WAIST","AMMO"];
// Paper doll, laid out like the classic inventory window. null = empty cell.
const DOLL = [
  [null, ["ear1","EAR",1], ["neck","NECK",5], ["face","FACE",3], ["head","HEAD",2], ["ear2","EAR",4]],
  [["fing1","FINGER",15], ["wrist1","WRIST",9], ["arms","ARMS",7], ["hands","HANDS",12], ["wrist2","WRIST",10], ["fing2","FINGER",16]],
  [["shoul","SHOULD",6], ["chest","CHEST",17], ["back","BACK",8], ["waist","WAIST",20], ["legs","LEGS",18], ["feet","FEET",19]],
  [null, null, ["prim","PRIME",13], ["sec","SEC",14], ["range","RANGE",11], ["ammo","AMMO",21]],
];
const SLOTS = Object.fromEntries(DOLL.flat().filter(Boolean).map(([k, l, b]) => [k, { key: k, label: l, bit: b }]));
// Slot filter chips merge the paired slots.
const SLOT_CHIPS = [["EAR",[1,4]],["NECK",[5]],["FACE",[3]],["HEAD",[2]],["FINGER",[15,16]],["WRIST",[9,10]],["ARMS",[7]],["HANDS",[12]],["SHOULD",[6]],["CHEST",[17]],["BACK",[8]],["WAIST",[20]],["LEGS",[18]],["FEET",[19]],["PRIME",[13]],["SEC",[14]],["RANGE",[11]],["AMMO",[21]]];
const TYPES = {0:"1H Slashing",1:"2H Slashing",2:"Piercing",3:"1H Blunt",4:"2H Blunt",5:"Archery",7:"Throwing",8:"Shield",10:"Armor",11:"Misc",12:"Lockpicks",14:"Food",15:"Drink",16:"Light",17:"Combinable",18:"Bandages",19:"Throwing",20:"Scroll",21:"Potion",23:"Wind Instrument",24:"Stringed Instrument",25:"Brass Instrument",26:"Percussion Instrument",27:"Arrow",29:"Jewelry",35:"2H Piercing",45:"Hand to Hand"};
const TWO_HAND = new Set([1, 4, 35]);
const WEAPON = new Set([0,1,2,3,4,5,7,19,35,45]);
const SIZES = ["TINY","SMALL","MEDIUM","LARGE","GIANT"];
const ELEM = {1:"Magic",2:"Fire",3:"Cold",4:"Poison",5:"Disease"};
const STATS = [["str","STR"],["sta","STA"],["agi","AGI"],["dex","DEX"],["wis","WIS"],["int","INT"],["cha","CHA"]];
const RESISTS = [["pr","POISON"],["mr","MAGIC"],["dr","DISEASE"],["fr","FIRE"],["cr","COLD"]];
const SNAP = new Date(D.snapshot + "T00:00:00");
const NOW = new Date(D.built + "T00:00:00");
const WINDOW_DAYS = 182;

// ---------- data shaping ----------
const ITEMS = D.items;
for (const [id, it] of Object.entries(ITEMS)) { it.id = +id; it.holders = []; it.total = 0; }
for (const [char, loc, id, count] of D.bank) { const it = ITEMS[id]; it.holders.push({ char, loc, count }); it.total += count; }
const ICON_URL = {};
for (const [k, b64] of Object.entries(D.icons)) {
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  ICON_URL[k] = URL.createObjectURL(new Blob([u8], { type: "image/png" }));
}
const iconImg = it => ICON_URL[it.icon] ? `<img src="${ICON_URL[it.icon]}" alt="">` : "";
const BANKERS = [...new Set(D.bank.map(r => r[0]))].sort();

function kindOf(it) {
  if (it.scroll || /^Spell: /.test(it.name)) return "spell";
  if (it.cls === 1 || it.bagslots) return "bag";
  if ((it.slots || 0) & ~1) return "gear";
  return "other";
}
for (const it of Object.values(ITEMS)) it.kind = kindOf(it);

// Green auctions within the last ~6 months, judged against the build date.
function auctions(it) {
  const rows = (it.green || []).map(([d, seller, price]) => ({ d: new Date(d + "T00:00:00"), seller, price }));
  const cutoff = new Date(NOW - WINDOW_DAYS * 864e5);
  const recent = rows.filter(r => r.d >= cutoff);
  const sellers = new Map();
  for (const r of recent) sellers.set(r.seller, (sellers.get(r.seller) || 0) + 1);
  const prices = recent.map(r => r.price).sort((a, b) => a - b);
  const median = prices.length ? (prices.length % 2 ? prices[(prices.length - 1) / 2] : Math.round((prices[prices.length / 2 - 1] + prices[prices.length / 2]) / 2)) : null;
  // A steady market also needs a listing in the last two months, not just a burst long ago.
  const fresh = recent.some(r => r.d >= new Date(NOW - 60 * 864e5));
  const level = recent.length >= 5 && sellers.size >= 3 && fresh ? "solid" : recent.length ? "thin" : "none";
  return { rows, recent, sellers, median, level, older: rows.length - recent.length, hasTracker: it.green != null };
}
for (const it of Object.values(ITEMS)) it.auc = auctions(it);

const sumOf = (it, keys) => keys.reduce((s, [k]) => s + (it[k] || 0), 0);

// ---------- state ----------
const STORE_KEY = "castle-bank-v1";
let state = { name: "", cls: -1, race: -1, eq: {}, sel: null, mineOnly: true, slotChip: null, q: "", kind: "all", banker: "", sort: "name" };
try { Object.assign(state, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); } catch (e) {}
state.eq = Object.fromEntries(Object.entries(state.eq || {}).filter(([k, id]) => SLOTS[k] && ITEMS[id]));
function save() {
  const { name, cls, race, eq, mineOnly, kind, sort } = state;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ name, cls, race, eq, mineOnly, kind, sort })); } catch (e) {}
}

const usable = it => (state.cls < 0 || ((it.classes ?? ALL_CLASSES) & (1 << state.cls))) && (state.race < 0 || ((it.races ?? ALL_RACES) & (1 << state.race)));
const fitsBit = (it, bit) => !!((it.slots || 0) & (1 << bit));
const equippedCount = id => Object.values(state.eq).filter(x => x == id).length;

// ---------- formatting ----------
function maskText(mask, list, all) {
  if (mask == null || (mask & all) === all) return "ALL";
  const on = list.filter((_, i) => mask & (1 << i)).map(x => x[0]);
  const off = list.filter((_, i) => !(mask & (1 << i))).map(x => x[0]);
  if (!on.length) return "NONE";
  return off.length < on.length ? "ALL except " + off.join(" ") : on.join(" ");
}
function slotText(it) {
  const names = [...new Set(SLOT_NAMES.map((n, i) => (it.slots & (1 << i)) ? n : null).filter(Boolean))];
  return names.join(" ");
}
const signed = v => (v > 0 ? "+" : "") + v;
function statLine(it) {
  const parts = [];
  if (it.ac) parts.push(`AC <b>${it.ac}</b>`);
  if (it.dmg) parts.push(`DMG <b>${it.dmg}</b>/${it.dly}`);
  if (it.hp) parts.push(`HP <b>${signed(it.hp)}</b>`);
  if (it.mana) parts.push(`MANA <b>${signed(it.mana)}</b>`);
  for (const [k, l] of STATS) if (it[k]) parts.push(`${l} <b>${signed(it[k])}</b>`);
  const res = RESISTS.filter(([k]) => it[k]).map(([k, l]) => `${l[0]}R ${signed(it[k])}`);
  if (res.length) parts.push(`<b>${res.join(" ")}</b>`);
  const sp = D.spells;
  if (it.worn && sp[it.worn]) parts.push(`Worn: <b>${esc(sp[it.worn].name)}</b>`);
  if (it.proc && sp[it.proc]) parts.push(`Proc: <b>${esc(sp[it.proc].name)}</b>`);
  if (it.focus && sp[it.focus]) parts.push(`Focus: <b>${esc(sp[it.focus].name)}</b>`);
  if (it.click && sp[it.click]) parts.push(`Click: <b>${esc(sp[it.click].name)}</b>`);
  if (it.scroll && sp[it.scroll]) {
    const lv = sp[it.scroll].lv.map((l, i) => l ? `${CLASSES[i][0]} ${l}` : null).filter(Boolean);
    if (lv.length) parts.push(lv.join(", "));
  }
  if (it.bagslots) parts.push(`${it.bagslots} slots, ${SIZES[it.bagsize] || ""}`);
  return parts.join(" · ");
}
function whereText(it) {
  const hs = holdersShown(it);
  if (!hs.length) return "";
  const chars = [...new Set(hs.map(h => h.char))];
  const n = hs.reduce((s, h) => s + h.count, 0);
  return chars.length === 1 ? `${chars[0]} · ${prettyLoc(hs[0].loc)}${hs.length > 1 ? ` +${hs.length - 1} more` : ""}${n > 1 ? ` · ×${n}` : ""}` : `×${n} across ${chars.length} bankers`;
}
const holdersShown = it => state.banker ? it.holders.filter(h => h.char === state.banker) : it.holders;
function prettyLoc(loc) {
  let m;
  if ((m = loc.match(/^General(\d+)-Slot(\d+)$/))) return `pack ${m[1]}, slot ${m[2]}`;
  if ((m = loc.match(/^General(\d+)$/))) return `inventory ${m[1]}`;
  if ((m = loc.match(/^Bank(\d+)-Slot(\d+)$/))) return `bank bag ${m[1]}, slot ${m[2]}`;
  if ((m = loc.match(/^Bank(\d+)$/))) return `bank ${m[1]}`;
  return "worn: " + loc.toLowerCase();
}

// ---------- paper doll ----------
function renderDoll() {
  const doll = $("#doll");
  doll.innerHTML = DOLL.flat().map(cell => {
    if (!cell) return `<div class="slot empty-cell" aria-hidden="true"></div>`;
    const [key, label] = cell;
    const id = state.eq[key], it = id && ITEMS[id];
    const warn = it && (!usable(it) || equippedCount(id) > it.total);
    const title = it ? `${label}: ${it.name}` : `${label}: empty`;
    return `<button type="button" class="slot${it ? " filled" : ""}${state.sel === key ? " selected" : ""}${warn ? " warn" : ""}" data-slot="${key}" title="${esc(title)}" aria-label="${esc(title)}" aria-pressed="${state.sel === key}"><span class="lbl">${label}</span>${it ? iconImg(it) : ""}</button>`;
  }).join("");
}
$("#doll").addEventListener("click", e => {
  const b = e.target.closest("[data-slot]");
  if (!b) return;
  const key = b.dataset.slot;
  if (state.sel === key && state.eq[key]) { openItem(state.eq[key]); return; }
  state.sel = state.sel === key ? null : key;
  state.slotChip = null;
  renderAll();
});

// ---------- gear totals ----------
let preview = null; // item id hovered while a slot is selected
function totals(eq) {
  const t = { hp: 0, mana: 0, ac: 0, wt: 0 };
  for (const [k] of [...STATS, ...RESISTS]) t[k] = 0;
  for (const id of Object.values(eq)) { const it = ITEMS[id]; for (const k in t) t[k] += it[k] || 0; }
  return t;
}
function equipInto(eq, key, id) {
  const next = { ...eq, [key]: id };
  const it = ITEMS[id];
  if (key === "prim" && TWO_HAND.has(it.type)) delete next.sec;
  if (key === "sec" && next.prim && TWO_HAND.has(ITEMS[next.prim].type)) delete next.prim;
  return next;
}
function renderStats() {
  const cur = totals(state.eq);
  const nxt = preview && state.sel ? totals(equipInto(state.eq, state.sel, preview)) : null;
  const row = (k, l, fmt = v => v) => {
    const d = nxt ? nxt[k] - cur[k] : 0;
    const dd = d ? `<span class="delta ${d > 0 ? "up" : "down"}">${signed(+fmt(d).toFixed ? +fmt(d).toFixed(1) : fmt(d))}</span>` : "";
    return `<dt>${l}</dt><dd>${fmt(cur[k])}${dd}</dd>`;
  };
  const cls = state.cls >= 0 ? CLASSES[state.cls][1] : "Any class", race = state.race >= 0 ? RACES[state.race][1] : "any race";
  const n = Object.keys(state.eq).length;
  $("#stats").innerHTML = `
    <div class="name">${esc(state.name || "Unnamed")}<small>${esc(cls)} · ${esc(race)}</small></div>
    <dl>${row("hp", "HP")}${row("mana", "MANA")}${row("ac", "AC")}</dl>
    <dl>${STATS.map(([k, l]) => row(k, l)).join("")}</dl>
    <dl>${RESISTS.map(([k, l]) => row(k, l)).join("")}</dl>
    <dl>${row("wt", "WEIGHT", v => Math.round(v) / 10)}</dl>
    <div class="caption">Bonuses from ${n} worn item${n === 1 ? "" : "s"}. Base stats not included.</div>`;
}

// ---------- browser ----------
function renderMine() {
  const who = [state.cls >= 0 ? CLASSES[state.cls][0] : null, state.race >= 0 ? RACES[state.race][0] : null].filter(Boolean).join(" ");
  $("#mine").innerHTML = `<button type="button" class="chip mine" id="c-mine" aria-pressed="${state.mineOnly}" ${who ? "" : "disabled"}>${who ? `Usable by ${esc(who)}` : "Pick a class or race to filter to your gear"}</button>` +
    (state.sel ? `<button type="button" class="chip mine" id="c-slot" aria-pressed="true">Fits ${SLOTS[state.sel].label} slot ✕</button>` : "");
  $("#slots").innerHTML = SLOT_CHIPS.map(([l]) => `<button type="button" class="chip" data-chip="${l}" aria-pressed="${state.slotChip === l}">${l}</button>`).join("");
}
$("#mine").addEventListener("click", e => {
  if (e.target.id === "c-mine") { state.mineOnly = !state.mineOnly; save(); renderAll(); }
  if (e.target.id === "c-slot") { state.sel = null; renderAll(); }
});
$("#slots").addEventListener("click", e => {
  const c = e.target.closest("[data-chip]");
  if (!c) return;
  state.slotChip = state.slotChip === c.dataset.chip ? null : c.dataset.chip;
  state.sel = null;
  renderAll();
});

function filtered() {
  const q = state.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  const chipBits = state.slotChip ? SLOT_CHIPS.find(c => c[0] === state.slotChip)[1] : null;
  const filterMine = state.mineOnly && (state.cls >= 0 || state.race >= 0);
  let out = Object.values(ITEMS).filter(it => {
    if (state.banker && !it.holders.some(h => h.char === state.banker)) return false;
    if (state.kind !== "all" && it.kind !== state.kind) return false;
    if (state.sel && !fitsBit(it, SLOTS[state.sel].bit)) return false;
    if (chipBits && !chipBits.some(b => fitsBit(it, b))) return false;
    if (filterMine && !usable(it)) return false;
    if (terms.length) {
      const hay = (it.name + " " + statLine(it).replace(/<[^>]+>/g, "")).toLowerCase();
      if (!terms.every(t => hay.includes(t))) return false;
    }
    return true;
  });
  const key = {
    ac: it => it.ac || 0, hp: it => it.hp || 0, mana: it => it.mana || 0,
    stats: it => sumOf(it, STATS), resists: it => sumOf(it, RESISTS),
    price: it => it.auc.median ?? -1, sellers: it => it.auc.recent.length * 10 + it.auc.sellers.size,
    count: it => holdersShown(it).reduce((s, h) => s + h.count, 0),
  }[state.sort];
  out.sort((a, b) => (key ? key(b) - key(a) : 0) || a.name.localeCompare(b.name));
  return out;
}

function compareText(it) {
  if (!state.sel) return "";
  const curId = state.eq[state.sel];
  const a = curId ? ITEMS[curId] : {};
  const ds = [["ac","AC"],["hp","HP"],["mana","MANA"],...STATS,...RESISTS.map(([k, l]) => [k, l[0] + "R"])]
    .map(([k, l]) => [l, (it[k] || 0) - (a[k] || 0)]).filter(([, d]) => d);
  if (!ds.length) return `<span class="cmp">${curId == it.id ? "Equipped" : "No stat change"}</span>`;
  return `<span class="cmp">${ds.slice(0, 5).map(([l, d]) => `<span class="delta ${d > 0 ? "up" : "down"}">${l} ${signed(d)}</span>`).join(" ")}</span>`;
}
function priceBadge(it) {
  const a = it.auc;
  if (!a.hasTracker) return "";
  if (a.level === "none") return `<span class="pill none">NO SALES 6MO</span>`;
  return `<span class="price ${a.level}"><b>${a.median}pp</b> · ${a.recent.length} ads / ${a.sellers.size} seller${a.sellers.size === 1 ? "" : "s"}</span>`;
}
function renderList() {
  const items = filtered();
  const total = Object.keys(ITEMS).length;
  const label = state.sel ? ` for your ${SLOTS[state.sel].label.toLowerCase()} slot` : state.slotChip ? ` for ${state.slotChip.toLowerCase()}` : "";
  $("#status").innerHTML = `<span>${items.length} of ${total} items${label}</span><span>Click an item for details${state.sel ? " or to equip" : ""}</span>`;
  if (!items.length) {
    $("#list").innerHTML = `<div class="empty">Nothing in the bank matches. Try clearing the slot or class filter.</div>`;
    return;
  }
  $("#list").innerHTML = items.map(it => `
    <button type="button" class="item${usable(it) ? "" : " unusable"}" data-id="${it.id}">
      <span class="ico">${iconImg(it)}</span>
      <span style="min-width:0">
        <span class="nm">${esc(it.name)}${it.nodrop ? `<span class="tag">NO DROP</span>` : ""}${it.lore ? `<span class="tag">LORE</span>` : ""}</span>
        <span class="line" style="display:block">${statLine(it) || (TYPES[it.type] || "")}</span>
        <span class="where" style="display:block">${esc(whereText(it))}</span>
      </span>
      <span class="right">${state.sel ? compareText(it) : ""}${priceBadge(it)}</span>
    </button>`).join("");
}
$("#list").addEventListener("click", e => { const r = e.target.closest("[data-id]"); if (r) openItem(+r.dataset.id); });
$("#list").addEventListener("mouseover", e => {
  const r = e.target.closest("[data-id]");
  const id = r ? +r.dataset.id : null;
  if (id !== preview && state.sel) { preview = id; renderStats(); }
});
$("#list").addEventListener("mouseleave", () => { if (preview) { preview = null; renderStats(); } });

// ---------- item window ----------
const SELLER_COLORS = ["#e4b85a", "#7fb8ff", "#8fd694", "#ef8a7a", "#c59cf2", "#62d2c6", "#f2a3cf", "#c9c37a", "#9fa8ff", "#f0b07a"];
function auctionChart(it) {
  const a = it.auc;
  if (!a.hasTracker) return `<p class="note">The P99 wiki has no Green auction data for this item.</p>`;
  const W = 520, H = 170, L = 40, R = 10, T = 10, B = 26;
  const start = new Date(NOW - WINDOW_DAYS * 864e5);
  const recent = a.recent;
  const order = [...a.sellers.entries()].sort((x, y) => y[1] - x[1]).map(x => x[0]);
  const color = s => SELLER_COLORS[order.indexOf(s) % SELLER_COLORS.length];
  const maxP = Math.max(10, ...recent.map(r => r.price));
  const niceMax = (() => { const p = Math.pow(10, Math.floor(Math.log10(maxP))); return Math.ceil(maxP / p) * p; })();
  const x = d => L + (W - L - R) * ((d - start) / (NOW - start));
  const y = p => T + (H - T - B) * (1 - p / niceMax);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Green auction prices over the last six months">`;
  for (let i = 0; i <= 4; i++) {
    const v = niceMax * i / 4, yy = y(v);
    svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${Math.round(v)}pp</text>`;
  }
  for (let m = 0; m <= 6; m++) {
    const d = new Date(NOW.getFullYear(), NOW.getMonth() - m, 1);
    if (d < start) continue;
    svg += `<line class="axis" x1="${x(d)}" x2="${x(d)}" y1="${H - B}" y2="${H - B + 4}"/><text x="${x(d)}" y="${H - 8}" text-anchor="middle">${d.toLocaleString("en-US", { month: "short" })}</text>`;
  }
  svg += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  if (a.median != null) svg += `<line x1="${L}" x2="${W - R}" y1="${y(a.median)}" y2="${y(a.median)}" stroke="var(--gold)" stroke-dasharray="3 4" opacity=".6"/>`;
  for (const r of recent) svg += `<circle cx="${x(r.d).toFixed(1)}" cy="${y(r.price).toFixed(1)}" r="5" fill="${color(r.seller)}" stroke="var(--window)" stroke-width="1.5"><title>${r.d.toISOString().slice(0, 10)} · ${esc(r.seller)} · ${r.price}pp</title></circle>`;
  svg += `</svg>`;
  const last = a.rows[0];
  const ago = last ? Math.round((NOW - last.d) / 864e5) : null;
  const verdict = { solid: `<span class="pill solid">STEADY MARKET</span>`, thin: `<span class="pill thin">THIN DATA</span>`, none: `<span class="pill none">NO SALES 6MO</span>` }[a.level];
  const sum = recent.length
    ? `${verdict}<span><b>${a.median}pp</b> median</span><span>${Math.min(...recent.map(r => r.price))}–${Math.max(...recent.map(r => r.price))}pp</span><span>${recent.length} listing${recent.length === 1 ? "" : "s"} from ${a.sellers.size} seller${a.sellers.size === 1 ? "" : "s"}</span><span>last seen ${ago === 0 ? "today" : ago + "d ago"}</span>`
    : `${verdict}<span>${last ? `Last listed ${last.d.toISOString().slice(0, 10)} for ${last.price}pp` : "Never listed"}</span>`;
  const legend = order.map(s => `<span><i style="background:${color(s)}"></i>${esc(s)} ×${a.sellers.get(s)}</span>`).join("");
  return `<div class="auc-sum">${sum}</div>${recent.length ? svg + `<div class="sellers">${legend}</div>` : ""}
    <p class="note">One dot per WTS listing. The wiki keeps only the last 20 listings${a.older ? `; ${a.older} older one${a.older === 1 ? " is" : "s are"} outside this 6-month window` : ""}.</p>`;
}

const RAID_REAGENTS = /^(Peridot|Hate Stone|Pearl|Small Portal Fragment)s?$/i;
function bankRequest(it) {
  const mule = (state.banker && it.holders.find(h => h.char === state.banker) || it.holders[0] || {}).char || "Mule";
  const sp = it.scroll && D.spells[it.scroll];
  const mkt = it.auc.level !== "none" ? it.auc.median : null;
  if (sp || it.kind === "spell") {
    const spellName = it.name.replace(/^Spell: /, "");
    const lv = sp ? sp.lv : [];
    let ci = state.cls >= 0 && lv[state.cls] ? state.cls : lv.findIndex(l => l > 0);
    const level = ci >= 0 ? lv[ci] : null;
    const cls = ci >= 0 ? CLASSES[ci][1] : "Class";
    let cost = "Check the dropped-spell rules in Discord.";
    if (level >= 51 && level <= 54) cost = `Bank price: <b>50pp</b> (levels 51–54).`;
    else if (level >= 55) cost = `Bank price: the lesser of <b>200pp</b>${mkt ? ` (market ${mkt}pp)` : ""} or <b>1 DKP</b> (levels 55–60). Forbidden spells go to DKP auction.`;
    else if (level) cost = `Level ${level} spell. Ask a banker about price.`;
    return { text: `Dropped spell: ${cls}, ${level ?? "Level"}, ${spellName} (${mule}, 1)`, cost };
  }
  if (RAID_REAGENTS.test(it.name)) return { text: `Raid Reagents: ${it.name}, 1`, cost: `Free for raid use.` };
  if (it.kind === "bag") return { text: null, cost: `Bags aren't for sale.` };
  const cost = mkt ? `Bank price: about <b>${Math.round(mkt * 0.8)}pp</b> (80% of the ${mkt}pp Green median${it.auc.level === "thin" ? ", thin data" : ""}).` : `Bank price: 80% of market rate. No recent Green sales to go by, so ask a banker.`;
  return { text: `Misc item: ${it.name} (${mule})`, cost };
}

function openItem(id) {
  const it = ITEMS[id];
  const sp = D.spells;
  const flags = [it.magic && "MAGIC ITEM", it.lore && "LORE ITEM", it.nodrop && "NO DROP", it.norent && "NO RENT"].filter(Boolean).join("  ");
  const lines = [];
  if (it.slots & ~1) lines.push(`<div><span class="k">Slot:</span> ${slotText(it)}</div>`);
  if (WEAPON.has(it.type) && it.dmg) lines.push(`<div><span class="k">Skill:</span> ${TYPES[it.type]} &nbsp;<span class="k">Atk Delay:</span> ${it.dly}</div><div><span class="k">DMG:</span> ${it.dmg}${it.rng ? ` &nbsp;<span class="k">Range:</span> ${it.rng}` : ""}</div>`);
  if (it.elemamt) lines.push(`<div><span class="k">${ELEM[it.elemtype] || "Elemental"} DMG:</span> ${it.elemamt}</div>`);
  if (it.baneamt) lines.push(`<div><span class="k">Bane DMG:</span> ${it.baneamt}</div>`);
  if (it.ac) lines.push(`<div><span class="k">AC:</span> ${it.ac}</div>`);
  const st = STATS.filter(([k]) => it[k]).map(([k, l]) => `<span>${l}: ${signed(it[k])}</span>`);
  if (it.hp) st.push(`<span>HP: ${signed(it.hp)}</span>`);
  if (it.mana) st.push(`<span>MANA: ${signed(it.mana)}</span>`);
  if (st.length) lines.push(`<div class="grid2">${st.join("")}</div>`);
  const rs = RESISTS.filter(([k]) => it[k]).map(([k, l]) => `<span>SV ${l}: ${signed(it[k])}</span>`);
  if (rs.length) lines.push(`<div class="grid2">${rs.join("")}</div>`);
  const eff = [["worn", "Worn Effect"], ["proc", "Combat Effect"], ["focus", "Focus Effect"], ["click", "Effect"]]
    .filter(([k]) => it[k] && sp[it[k]]).map(([k, l]) => `<div><span class="k">${l}:</span> ${esc(sp[it[k]].name)}${k === "proc" && it.proclvl ? ` (lvl ${it.proclvl})` : ""}${k === "click" && it.charges > 0 ? ` · ${it.charges} charge${it.charges === 1 ? "" : "s"}` : ""}</div>`);
  lines.push(...eff);
  if (it.scroll && sp[it.scroll]) {
    const lv = sp[it.scroll].lv.map((l, i) => l ? `${CLASSES[i][0]}(${l})` : null).filter(Boolean).join(" ");
    lines.push(`<div><span class="k">Spell:</span> ${esc(sp[it.scroll].name)}${lv ? ` · ${lv}` : ""}</div>`);
  }
  if (it.bagslots) lines.push(`<div><span class="k">Capacity:</span> ${it.bagslots} &nbsp;<span class="k">Size:</span> ${SIZES[it.bagsize] || "?"}${it.bagwr ? ` &nbsp;<span class="k">Weight Reduction:</span> ${it.bagwr}%` : ""}</div>`);
  lines.push(`<div><span class="k">WT:</span> ${((it.wt || 0) / 10).toFixed(1)} &nbsp;<span class="k">Size:</span> ${SIZES[it.size || 0]}</div>`);
  if (it.slots & ~1 || it.scroll) {
    lines.push(`<div><span class="k">Class:</span> ${maskText(it.classes, CLASSES, ALL_CLASSES)}</div><div><span class="k">Race:</span> ${maskText(it.races, RACES, ALL_RACES)}</div>`);
  }
  if (it.unknown) lines.push(`<div class="note">This item isn't in the item database (likely P99-specific). Check the wiki for stats.</div>`);

  const hs = it.holders.map(h => `<div>${esc(h.char)} <span>· ${esc(prettyLoc(h.loc))}${h.count > 1 ? ` · ×${h.count}` : ""}</span></div>`).join("");
  const fitKeys = Object.values(SLOTS).filter(s => fitsBit(it, s.bit)).map(s => s.key);
  const target = state.sel && fitKeys.includes(state.sel) ? state.sel : fitKeys.find(k => !state.eq[k]) || fitKeys[0];
  const isOn = Object.entries(state.eq).filter(([, v]) => v == id).map(([k]) => k);
  const outOfStock = equippedCount(id) >= it.total && !isOn.includes(target);
  let btns = "";
  if (isOn.length) btns += `<button class="stone" data-act="unequip" type="button">Unequip</button>`;
  if (target && !(isOn.includes(target))) btns += `<button class="stone" data-act="equip" data-slot="${target}" type="button" ${outOfStock ? "disabled title=\"Every copy in the bank is already equipped\"" : ""}>Equip ${SLOTS[target].label.toLowerCase()}</button>`;
  btns += `<button class="stone" data-act="close" type="button">Done</button>`;
  const warn = target && !usable(it) ? `<p class="note" style="color:var(--bad)">Your ${state.cls >= 0 ? CLASSES[state.cls][1] : ""} ${state.race >= 0 ? RACES[state.race][1] : ""} can't use this.</p>` : "";

  const ov = $("#overlay");
  ov.innerHTML = `<div class="win iw" role="dialog" aria-modal="true" aria-labelledby="iw-title">
    <div class="iw-head"><span class="ico">${iconImg(it)}</span><div><h2 id="iw-title">${esc(it.name)}</h2><div class="flags">${flags}</div></div></div>
    <div class="block">${lines.join("")}</div>
    <div class="sec"><h3>IN THE BANK · ${it.total}</h3><div class="holders">${hs}</div></div>
    ${(() => { const r = bankRequest(it); return `<div class="sec req"><h3>REQUEST FROM THE BANK</h3>${r.text ? `<div class="req-line"><code id="req-text">${esc(r.text)}</code><button class="stone" data-act="copy" type="button">Copy</button></div>` : ""}<div class="cost">${r.cost}</div><div class="note">Paste it in #bank-requests and say how long you'll be online.</div></div>`; })()}
    <div class="sec"><h3>GREEN AUCTIONS · LAST 6 MONTHS</h3>${auctionChart(it)}</div>
    ${it.wiki ? `<div class="note"><a href="${esc(it.wiki)}" target="_blank" rel="noopener">Open on the P99 wiki</a></div>` : ""}
    ${warn}
    <div class="btns">${btns}</div>
  </div>`;
  ov.hidden = false;
  ov.dataset.id = id;
  (ov.querySelector('[data-act="equip"]') || ov.querySelector('[data-act="close"]')).focus();
}
function closeItem() { $("#overlay").hidden = true; $("#overlay").innerHTML = ""; }
$("#overlay").addEventListener("click", e => {
  if (e.target.id === "overlay") return closeItem();
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const id = +$("#overlay").dataset.id;
  if (b.dataset.act === "copy") {
    const code = $("#req-text"), text = code.textContent;
    const done = ok => { b.textContent = ok ? "Copied" : "Select"; if (!ok) getSelection().selectAllChildren(code); };
    try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch (err) { done(false); }
    return;
  }
  if (b.dataset.act === "equip") { state.eq = equipInto(state.eq, b.dataset.slot, id); state.sel = null; preview = null; }
  if (b.dataset.act === "unequip") { for (const [k, v] of Object.entries(state.eq)) if (v == id) delete state.eq[k]; }
  save(); closeItem(); renderAll();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#overlay").hidden) closeItem(); });

$("#f-class").innerHTML = `<option value="-1">Any</option>` + CLASSES.map(([, n], i) => `<option value="${i}">${n}</option>`).join("");
$("#f-race").innerHTML = `<option value="-1">Any</option>` + RACES.map(([, n], i) => `<option value="${i}">${n}</option>`).join("");
$("#banker").innerHTML = `<option value="">All bankers</option>` + BANKERS.map(b => `<option>${esc(b)}</option>`).join("");
$("#f-name").value = state.name; $("#f-class").value = state.cls; $("#f-race").value = state.race;
$("#kind").value = state.kind; $("#sort").value = state.sort;
$("#f-name").addEventListener("input", e => { state.name = e.target.value; save(); renderStats(); });
