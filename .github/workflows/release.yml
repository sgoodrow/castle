name: Release

# Every push to main: runs Test (the workflow PRs run) and builds the image from the same commit at
# once, and has Dokku run the image (`git:from-image`) only when both pass. The image is built here,
# where there's CPU and a layer cache, not on the server. To roll back to an earlier build:
# `dokku git:from-image castle-discord-bot ghcr.io/sgoodrow/castle:<sha>` on the server.
on:
  push:
    branches: [main]

# One release at a time, in push order. A push that arrives while one is waiting replaces it: the
# newer commit holds it.
concurrency:
  group: release

env:
  IMAGE: ghcr.io/sgoodrow/castle:${{ github.sha }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: SOURCE_REV=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, image]
    runs-on: ubuntu-latest
    steps:
      # The server pulls without credentials, so the package has to be public (a one-time setting).
      - name: Check the server can pull the image
        run: |
          docker manifest inspect "$IMAGE" > /dev/null || {
            echo "::error::Can't pull $IMAGE anonymously. Make the package public at https://github.com/users/sgoodrow/packages/container/castle/settings, then re-run this job."
            exit 1
          }
      - uses: dokku/github-action@v1.4.0
        with:
          git_remote_url: 'ssh://dokku@172.105.106.208/castle-discord-bot'
          ssh_private_key: ${{ secrets.DOKKU_PRIVATE_KEY }}
          deploy_docker_image: ${{ env.IMAGE }}
          ci_commit: ${{ github.sha }}
