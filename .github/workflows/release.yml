name: Release

# Builds the image here, where there's CPU and a layer cache, from the commit Test passed on main, and
# has Dokku run it (`git:from-image`) instead of building on the server. To roll back to an earlier
# build: `dokku git:from-image castle-discord-bot ghcr.io/sgoodrow/castle:<sha>` on the server.
on:
  workflow_run:
    workflows: [Test]
    branches: [main]
    types: [completed]

concurrency:
  group: release

env:
  IMAGE: ghcr.io/sgoodrow/castle:${{ github.event.workflow_run.head_sha }}

jobs:
  image:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: SOURCE_REV=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      # The server pulls without credentials, so the package has to be public (a one-time setting).
      - name: Check the server can pull the image
        run: |
          docker manifest inspect "$IMAGE" > /dev/null || {
            echo "::error::Can't pull $IMAGE anonymously. Make the package public at https://github.com/users/sgoodrow/packages/container/castle/settings, then re-run this job."
            exit 1
          }
      - uses: dokku/github-action@v1.4.0
        with:
          git_remote_url: 'ssh://dokku@172.105.106.208/castle-discord-bot'
          ssh_private_key: ${{ secrets.DOKKU_PRIVATE_KEY }}
          deploy_docker_image: ${{ env.IMAGE }}
          ci_commit: ${{ github.event.workflow_run.head_sha }}
