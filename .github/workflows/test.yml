name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Auto-fix PRs are opened with GITHUB_TOKEN, which doesn't start pull_request runs, so
  # .github/workflows/auto-fix.yml starts this on their branch instead.
  workflow_dispatch:

jobs:
  # The bot and the bank web server. Coverage can't drop in any file with tests (jest.config.js).
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn
          cache-dependency-path: yarn.lock

      # Claude's fixes have to fix the code, not the tests. main's copy of the check runs, so the
      # branch can't change what it checks.
      - name: Tests kept
        if: startsWith(github.head_ref || github.ref_name, 'auto-fix/')
        run: git show origin/main:.github/scripts/check-tests-kept.sh | bash -s origin/main

      - run: yarn install --frozen-lockfile
      - run: yarn tsc
      - run: yarn test:ci
      # Lint gates only the bank: its server here, its page in the bank job (together, `yarn lint`).
      - run: yarn eslint src/web

  # The bank page. Same rule for coverage (bank/web/vite.config.ts).
  bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: bank/web/package-lock.json

      - run: npm ci --prefix bank/web
      - run: npm --prefix bank/web run lint
      # Type-checks the page and its features, then builds it.
      - run: npm --prefix bank/web run build
      - run: npm --prefix bank/web run test:ci

  # Branch protection on main requires a check named `test`: it passes only when both jobs do.
  test:
    needs: [bot, bank]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.bot.result != 'success' || needs.bank.result != 'success'
        run: exit 1
