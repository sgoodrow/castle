name: Bank Pages

# Builds the guild bank browser (bank/) and publishes it to GitHub Pages.
# The nightly run refreshes the bank sheet and Green auction data; it commits nothing.
on:
  push:
    branches: [main]
    paths: ["bank/**", "src/shared/items.ts", ".github/workflows/bank-pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: bank

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore wiki/icon cache
        uses: actions/cache@v4
        with:
          path: |
            bank/data/wiki
            bank/data/icons
          key: bank-wiki-${{ github.run_id }}
          restore-keys: |
            bank-wiki-

      - name: Fetch bank sheet
        run: python3 -I scripts/fetch_sheet.py .

      - name: Scrape P99 wiki (cached 7 days)
        run: python3 -I scripts/scrape_wiki.py .

      - name: Build page
        run: python3 -I scripts/build.py .

      - name: Prepare site
        run: cp dist/castle-bank.html dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bank/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
